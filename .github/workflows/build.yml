name: build binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GO_VERSION: "1.27.0"
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        run: |
          curl -fsSLo /tmp/go.tar.gz \
            "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf /tmp/go.tar.gz
          echo /usr/local/go/bin >> "$GITHUB_PATH"

      - name: Build frontend
        working-directory: ui
        run: |
          npm ci
          npm run build

      # The binary itself, not a tarball of it. An artifact is already
      # served as a zip on download, so packaging one inside it only
      # meant unpacking twice to reach a single file.
      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p artifacts

          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64
          do
            goos=${target%/*}
            goarch=${target#*/}
            name="cca-${goos}-${goarch}"

            if [ "$goos" = windows ]; then
              name="$name.exe"
            fi

            GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath -ldflags="-s -w" -o "artifacts/$name" ./cmd/cca
          done

          cd artifacts
          sha256sum -- * > SHA256SUMS

      # One artifact per target, so the run page offers six downloads
      # and somebody on one platform takes only their own. Uploading
      # them together meant every download carried all six.
      #
      # compression-level is left at its default rather than 0: the
      # payload used to be already-compressed archives, where spending
      # time on it bought nothing. A bare Go binary is not, and halves.
      - name: Upload linux/amd64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cca-linux-amd64
          path: artifacts/cca-linux-amd64
          if-no-files-found: error

      - name: Upload linux/arm64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cca-linux-arm64
          path: artifacts/cca-linux-arm64
          if-no-files-found: error

      - name: Upload darwin/amd64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cca-darwin-amd64
          path: artifacts/cca-darwin-amd64
          if-no-files-found: error

      - name: Upload darwin/arm64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cca-darwin-arm64
          path: artifacts/cca-darwin-arm64
          if-no-files-found: error

      - name: Upload windows/amd64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cca-windows-amd64
          path: artifacts/cca-windows-amd64.exe
          if-no-files-found: error

      - name: Upload windows/arm64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cca-windows-arm64
          path: artifacts/cca-windows-arm64.exe
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS
          if-no-files-found: error
