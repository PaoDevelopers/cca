name: check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"
  GOTOOLCHAIN: local
  GOLANGCI_VERSION: "v2.12.2"
  STATICCHECK_VERSION: "v0.8.0-rc.1"
  PGHOST: /var/run/postgresql

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        run: |
          curl -fsSLo /tmp/go.tar.gz \
            "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf /tmp/go.tar.gz
          echo /usr/local/go/bin >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest

      - name: Install golangci-lint
        run: |
          mkdir -p "$HOME/go/bin"
          git clone --depth 1 --branch "$GOLANGCI_VERSION" \
            https://github.com/golangci/golangci-lint /tmp/golangci-lint
          cd /tmp/golangci-lint
          go get "honnef.co/go/tools@$STATICCHECK_VERSION"
          go build -o "$HOME/go/bin/golangci-lint" ./cmd/golangci-lint

      # plpgsql_check is the only static analysis the plpgsql functions
      # get: CREATE FUNCTION does not check their bodies.
      - name: Install plpgsql_check
        run: sudo apt-get install -y postgresql-17-plpgsql-check

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          pg_lsclusters
          sudo -u postgres createuser --superuser "$(id -un)"
          psql -tAc 'select version()'

      - name: Check for a browser
        run: |
          command -v chromium || command -v chromium-browser \
            || command -v google-chrome

      - name: Build
        run: make

      - name: Check
        run: make check
