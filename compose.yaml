name: cca-local

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cca
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/fixtures/mock_data.sql:/docker-entrypoint-initdb.d/002-mock-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cca"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8192:8192"
    volumes:
      - ./cca.scfgs:/run/cca/cca.scfgs:ro
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8192/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
